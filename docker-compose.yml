services:
  # ==================== POSTGRESQL DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: ecoflow_postgres
    environment:
      POSTGRES_USER: ecoflow_user
      POSTGRES_PASSWORD: ecoflow_password
      POSTGRES_DB: ecoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoflow_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ecoflow_network

  # ==================== REDIS CACHE ====================
  redis:
    image: redis:7-alpine
    container_name: ecoflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ecoflow_network

  # ==================== MINIO OBJECT STORAGE ====================
  minio:
    image: minio/minio:latest
    container_name: ecoflow_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port (Web UI)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - ecoflow_network

  # ==================== BACKEND API ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoflow_backend
    environment:
      DATABASE_URL: postgresql://ecoflow_user:ecoflow_password@postgres:5432/ecoflow
      REDIS_URL: redis://redis:6379
      FIREBASE_CREDENTIALS_PATH: ./firebase-credentials.json
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: ecoflow-bucket
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./firebase-credentials.json:/app/firebase-credentials.json
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - ecoflow_network

  # ==================== ADMINER (Database GUI - Opsional) ====================
  adminer:
    image: adminer:latest
    container_name: ecoflow_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ecoflow_network

# ==================== VOLUMES (Data Persistence) ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ==================== NETWORKS ====================
networks:
  ecoflow_network:
    driver: bridge